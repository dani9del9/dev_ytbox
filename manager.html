<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>YTBox — Gestor</title>
<link rel="stylesheet" href="manager.css">
</head>
<body>
<aside id="side">
  <div class="brand"><span class="brand-logo"></span> <span>YTBox</span></div>
  <button id="newGroup" class="primary wide">+ Nuevo grupo</button>
  <div id="groupList"></div>
  <nav class="side-nav">
    <button data-view="tv"><span class="nav-ico" data-ico="tv"></span> Modo TV</button>
    <button data-view="discover"><span class="nav-ico" data-ico="brujula"></span> Descubrir</button>
    <button data-view="calendar"><span class="nav-ico" data-ico="calendario"></span> Calendario</button>
    <button data-view="channels"><span class="nav-ico" data-ico="grupo" data-plain="1"></span> Todos los canales</button>
    <button data-view="settings"><span class="nav-ico" data-ico="engranaje" data-plain="1"></span> Ajustes</button>
  </nav>
</aside>

<main id="main"></main>

<!-- Selector de iconos -->
<div id="picker" class="modal hidden">
  <div class="modal-box">
    <div class="picker-head">
      <div id="pickPreview" class="pick-preview"></div>
      <div class="picker-tabs" id="pickTabs">
        <button data-tab="emoji" class="on">😀 Emojis</button>
        <button data-tab="svg">✏️ Iconos</button>
        <button data-tab="text">Aa Texto</button>
        <button data-tab="image">🖼 Imagen</button>
        <button data-tab="avatar">👤 Avatares</button>
      </div>
      <button class="icon-btn" id="pickClose" title="Cerrar">✕</button>
    </div>
    <div class="picker-opts">
      <label>Color <input type="color" id="pickColor"></label>
      <div id="swatches" class="swatches"></div>
      <label class="chk"><input type="checkbox" id="pickBg"> Fondo de color</label>
      <label class="chk"><input type="checkbox" id="pickRound"> Redondo</label>
    </div>
    <div id="recent" class="recent"></div>
    <div id="pickBody" class="picker-body"></div>
    <div class="picker-foot">
      <span id="pickCount" class="muted"></span>
      <button id="pickOk" class="primary">Usar este icono</button>
    </div>
  </div>
</div>

<script src="emoji-data.js"></script>
<script src="svg-icons.js"></script>
<script src="common.js"></script>
<script src="yt-api.js"></script>
<script src="tv.js"></script>
<script src="discover.js"></script>
<script src="manager.js"></script>
</body>
</html>
